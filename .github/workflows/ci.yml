name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Skip the postinstall hook, the browser download is only needed for screenshots
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate CV data against JSON schemas
        run: npm run validate

      - name: Check JSON syntax
        run: |
          for file in html/i18n/*.json themes/*.json cv-schema.json cv-content-schema.json; do
            [ -f "$file" ] || continue
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf-8"))' "$file"
            echo "✅ $file"
          done

      - name: Check JavaScript syntax
        run: |
          for file in html/app.js scripts/*.js screenshot.js; do
            node --check "$file"
            echo "✅ $file"
          done

      - name: Lint HTML
        run: npm run lint:html
